<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="dark">
  <header>
    <h1>Tic Tac Toe</h1>
  </header>

  <main>

    <div id="inputs-container">
      <label for="playerOne">
        <p>X</p>
        <input type="text" id="player-one-input" placeholder="Player Name">
      </label>
      <label for="playerTwo">
        <p>O</p>
        <input type="text" id="player-two-input" placeholder="Player Name">
      </label>
    </div>

    <div id="buttons-container">
      <button id="start-button">Start New Game</button>
    </div>

    <div id="info-container"></div>

    <div id="gameboard-display"></div>

  </main>

  <footer>
    <small>made by c8in4</small>
  </footer>

  <div class="theme-button" onclick="toggleTheme()">Switch Theme</div>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark')
    }
  </script>
</body>

</html>
